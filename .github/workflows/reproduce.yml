name: Reproduce

# Regenerate every reported number from the raw HDB5 data and fail if a
# committed artifact under results/ moved.
#
# This is what makes the figures in the README, RESULTS.md and the paper
# enforceable rather than aspirational. tests/test_reported_numbers.py already
# runs in the ordinary suite and ties the prose to results/; this job closes the
# remaining gap by checking that results/ itself still follows from the data.
#
# It is not on the pull-request path: it downloads a third-party dataset from
# OSF and runs six analyses, so it runs on a schedule, on demand, and whenever
# an analysis script or its output changes on main.
on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "analysis_*.py"
      - "hdb5.py"
      - "scaling_law.py"
      - "dimensional.py"
      - "spectral.py"
      - "conformal_shift.py"
      - "replication.py"
      - "allometry.py"
      - "gp.py"
      - "tree_allometry.py"
      - "forecast.py"
      - "fusionflux/**"
      - "results/**"
      - "site/build_page.py"
      - ".github/workflows/reproduce.yml"

permissions:
  contents: read

concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    # macOS, because that is the platform results/ was generated on, and the
    # numbers depend on it. The analyses are deterministic -- every random draw
    # is seeded, and rerunning them on the machine results/ came from reproduces
    # the committed values exactly -- but they are deterministic *per platform*
    # only. The solvers underneath are not: macOS links Accelerate for LAPACK
    # and the Linux runners use OpenBLAS, and on byte-identical seeded inputs
    # the two disagree. On ubuntu-latest this job failed on roughly two thousand
    # values spread across every analysis in the study -- conformal coverage,
    # robustness, replication, the allometry scores -- and it never passed once
    # in sixteen attempts. That is a different LAPACK, not a failure to
    # reproduce, and no exclusion list should paper over drift that broad.
    #
    # So it runs where the numbers were made. This narrows what the job claims,
    # to what it was always for: that results/ still follows from the raw data
    # on the platform it was generated on. It is not a cross-platform
    # bit-reproducibility check -- see docs/testing.md.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        # Against the pinned constraints, not a fresh resolve. results/ was
        # generated in that environment, and the numbers depend on it: an
        # unconstrained install picked up scikit-learn 1.9 and numpy 2.5, which
        # moved several thousand values by up to a few percent -- a real change
        # in the library, reported here as a failure to reproduce the study.
        # This is the same environment the Dockerfile and the lowest-supported
        # CI job install, and this job is the one that most needs it.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt

      # Cache the OSF download between runs. The key is the pinned SHA-256, so
      # a change to the pin misses the cache and refetches rather than silently
      # analysing the old bytes.
      - name: Cache the HDB5 datasets
        uses: actions/cache@v6
        with:
          path: |
            data/raw/hdb5_std5.csv
            data/raw/hdb5_db523.csv
            data/raw/allometry_bmr.txt
          key: hdb5-${{ hashFiles('hdb5.py', 'replication.py', 'allometry.py') }}

      - name: Fetch and verify the datasets
        # Both are pinned by SHA-256 and verified on the staged download, so a
        # revision upstream fails here rather than quietly changing a result.
        run: |
          python3 hdb5.py download
          python3 hdb5.py verify
          python3 -c "import replication; replication.download_db523()"
          python3 -c "import allometry; allometry.download_allometry()"

      # Keep the committed artifacts to compare against, since the analyses
      # overwrite results/ in place.
      - name: Snapshot the committed results
        run: |
          mkdir -p .reproduce_baseline
          cp results/*.json results/*.csv .reproduce_baseline/

      - name: Regenerate results/ and rebuild the page
        run: make results

      - name: Fail if any reported number moved
        # Numeric, not a git diff: float64 tails jitter between runs because
        # threaded BLAS reductions do not fix summation order. The comparator
        # uses a 1e-6 relative tolerance, well inside the precision anything is
        # reported at. Figures are not compared at all, since matplotlib output
        # is not byte-reproducible across versions.
        #
        # A short list of paths is exempt even here, because running on macOS
        # narrows the platform but does not pin the machine: the conditioning
        # sweep exists to measure where float64 breaks down, and its numbers
        # move between two Macs. Those paths, and what still guards the findings
        # underneath them, are named one at a time in tools/compare_results.py.
        run: python3 tools/compare_results.py .reproduce_baseline results --max-report 200

      - name: Check the prose against the regenerated artifacts
        run: python -m pytest -q tests/test_reported_numbers.py

      # A failure above leaves the regenerated files on the runner; publish them
      # so the diff can be inspected without reproducing the run locally.
      - name: Upload the regenerated results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-results
          path: results/
