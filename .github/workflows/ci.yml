name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref so a fast-follow push doesn't leave
# stale jobs consuming runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        # The lowest supported version installs against the pinned constraints,
        # which are the environment every number under results/ was generated
        # in. The newer versions resolve current releases instead, so the
        # >=3.10 support claim is actually exercised rather than asserted.
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            pip install -e ".[dev]" -c constraints.txt
          else
            pip install -e ".[dev]"
          fi

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type check)
        run: mypy .

      - name: Pytest
        # The clean-install suite builds a wheel and a virtualenv per run, which
        # is far slower than the rest of the suite and needs no interpreter
        # matrix. It gets its own job below.
        run: pytest -q --cov --cov-report=term-missing -m "not slow"

  # What a user gets from `pip install fusionflux`, as opposed to what a
  # contributor gets from a checkout.
  #
  # This job exists because version 0.2.0's packaging was broken in two ways that
  # no test in the matrix above could see. The wheel did not carry
  # results/predictor.json, so the README's headline command raised
  # FileNotFoundError on a clean install; and it shipped every analysis script as
  # a top-level module, so installing it put `config`, `storage`, `validation`
  # and `tools` into site-packages where they shadowed anything else of that
  # name. Both are invisible from a checkout, because a checkout has the
  # repository root on sys.path and results/ already on disk.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      - name: Build the wheel and install it into a clean environment
        run: pytest -q --no-cov tests/test_packaging.py tests/test_wheel_smoke.py

  # The reproduction image, built but not run.
  #
  # `docker build` here proves the image assembles and that the dependency
  # install inside it succeeds, which is the part that rots: a pin that stops
  # resolving, or a system package matplotlib starts needing. Actually running
  # `make reproduce` inside it would download two third-party datasets and take
  # about twenty minutes, which is the `reproduce` workflow's job, on its own
  # schedule. This keeps the Dockerfile honest on every push for about a minute.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the reproduction image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fusionflux:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image that cannot import the study is not a reproduction image.
      - name: Confirm the study imports inside the image
        run: |
          docker run --rm fusionflux:ci python -c "
          import hdb5, scaling_audit, gp, tree_allometry
          from fusionflux import predict
          print('modules import; fusionflux', predict.__module__)
          "

      # No network, no datasets: this must still work, because the predictor
      # card ships inside the package.
      - name: Confirm `fusionflux predict` runs offline in the image
        run: |
          docker run --rm --network none fusionflux:ci \
            fusionflux predict --ip-ma 15 --bt-t 5.3 --ne-line-1e19-m3 10 \
            --p-loss-mw 87 --r-m 6.2 --inverse-aspect-ratio 0.3226 \
            --kappa 1.7 --m-eff-amu 2.5
