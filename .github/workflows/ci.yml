name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref so a fast-follow push doesn't leave
# stale jobs consuming runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        # Install the package plus dev tooling. The pinned constraints reproduce
        # the tested training/artifact-loading environment on 3.9; newer Python
        # versions resolve compatible releases instead so the >=3.9 support claim
        # is actually exercised.
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            pip install -e ".[dev]" -c constraints.txt
          else
            pip install -e ".[dev]"
          fi

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type check)
        run: mypy .

      - name: Pytest
        run: pytest -q --cov --cov-report=term-missing
