name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        # Install the package plus dev tooling against the pinned constraints so
        # CI reproduces the tested training/artifact-loading environment.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type check)
        run: mypy .

      - name: Pytest
        run: pytest -q
