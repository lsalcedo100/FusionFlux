name: Release

# Publish to PyPI on a version tag.
#
# The README's "Use it" section opens with `pip install fusionflux`, and until
# this workflow existed that command returned "No matching distribution found".
# Everything upstream of it, the thirteen results and the study behind them, was
# being judged by a reader whose first command failed.
#
# Trusted Publishing (OIDC) rather than an API token: PyPI verifies the identity
# of this workflow in this repository directly, so there is no long-lived secret
# to store, leak or rotate. Configure it once at
# https://pypi.org/manage/account/publishing/ with:
#     owner            lsalcedo100
#     repository       FusionFlux
#     workflow         release.yml
#     environment      pypi
#
# The build is gated on the same checks as everything else, plus the two suites
# that exist specifically for the distribution. A wheel that installs but cannot
# predict is the exact failure this repository shipped in 0.2.0, and it was
# invisible from a checkout, so `tests/test_wheel_smoke.py` runs against a real
# clean-venv install before anything is uploaded.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Publish to TestPyPI instead of PyPI"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gate. Nothing is uploaded unless a real installed wheel predicts
  # correctly from a directory that is not this repository.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
          pip install build

      - name: Quality gate
        run: |
          ruff check .
          mypy .

      - name: Packaging and clean-install suites
        run: pytest -q --no-cov tests/test_packaging.py tests/test_wheel_smoke.py

  build:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # results/predictor.json is committed, so the build hook in setup.py has
      # its source. If it ever stops being committed this fails here rather than
      # producing a wheel whose console command cannot start.
      - name: Confirm the predictor card is present to package
        run: test -f results/predictor.json

      - name: Build sdist and wheel
        run: python -m build

      - name: Confirm the card reached the wheel
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel, = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          if "fusionflux/predictor.json" not in names:
              sys.exit(f"{wheel} has no predictor card; the install would be unusable")
          tops = {n.split("/")[0] for n in names}
          tops = {t for t in tops if not t.endswith(".dist-info")}
          if tops != {"fusionflux"}:
              sys.exit(f"{wheel} would install {sorted(tops)}; expected only 'fusionflux'")
          print(f"{wheel}: ok, {len(names)} entries")
          PY

      # Catches the metadata faults PyPI rejects on upload, when rejection is
      # still free. A version cannot be re-uploaded once it is taken.
      - name: Check distribution metadata
        run: twine check --strict dist/*

      - name: Record the version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print("version=" + tomllib.load(handle)["project"]["version"])
          PY

      # A tag that disagrees with pyproject.toml would publish a version nobody
      # can find from the release page.
      - name: Confirm the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$packaged" ]; then
            echo "tag v$tag does not match pyproject version $packaged" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.test_pypi
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fusionflux
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fusionflux
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      # No password and no token: PyPI checks this workflow's OIDC identity.
      - uses: pypa/gh-action-pypi-publish@release/v1
