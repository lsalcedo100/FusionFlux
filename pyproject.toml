[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fusionflux"
version = "0.1.0"
description = "Train and run FusionFlux: a physics-aware ML pipeline for predicting D-T fusion neutron yield."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Liam" }]
dependencies = [
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
fusionflux = "fusionflux_cli:main"

[tool.setuptools]
py-modules = [
    "analysis_conformal",
    "analysis_extrapolation",
    "analysis_flexibility_sweep",
    "analysis_hybrid",
    "analysis_size_extrapolation",
    "analysis_scaling_law",
    "artifact_model",
    "config",
    "features",
    "fusionflux_cli",
    "hdb5",
    "inference",
    "inference_artifacts",
    "inference_selection",
    "lawson",
    "scaling_law",
    "storage",
    "train_model",
    "training",
    "training_artifacts",
    "training_registry",
    "training_reports",
    "training_split",
    "validation",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# The codebase intentionally uses long, descriptive lines; enforce everything
# except the line-length rule.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
# A wheel build copies every top-level module into build/lib, which mypy then
# sees as a second definition of each one and refuses to check anything at all.
# Building the distribution should not break `make check`.
exclude = ["^build/"]

[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*", "seaborn.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = [
    "analysis_conformal",
    "analysis_extrapolation",
    "analysis_flexibility_sweep",
    "analysis_hybrid",
    "analysis_size_extrapolation",
    "analysis_scaling_law",
    "artifact_model",
    "config",
    "features",
    "fusionflux_cli",
    "hdb5",
    "inference",
    "inference_artifacts",
    "inference_selection",
    "lawson",
    "scaling_law",
    "storage",
    "training",
    "training_artifacts",
    "training_registry",
    "training_reports",
    "train_model",
    "training_split",
    "validation",
]

[tool.coverage.report]
show_missing = true
