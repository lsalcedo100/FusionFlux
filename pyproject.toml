[build-system]
# 77 is the first release that accepts PEP 639 `license`/`license-files`. The
# TOML-table form below it is deprecated and stops being accepted after
# 2027-Feb-18, so pinning the floor here is cheaper than a build that starts
# failing on a date nobody is watching for.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fusionflux"
version = "0.2.1"
description = "Confinement scaling as a linear algebra problem: machine learning against the IPB98(y,2) scaling law on the ITPA HDB5 tokamak database."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Liam" }]
# What `fusionflux predict` actually needs, which is arithmetic over a few
# kilobytes of JSON. The wheel no longer ships the analysis scripts, so it no
# longer has to install what only they use: scikit-learn, matplotlib, seaborn
# and joblib moved to the `study` extra below. A tool whose whole argument is
# that you should prefer a power law to a tree ensemble should not make you
# install the tree ensemble to hear it.
dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
# Everything the analysis scripts need, for a checkout that is going to run
# `make results` rather than just predict.
study = [
    "joblib",
    "matplotlib",
    "scikit-learn",
    "seaborn",
]

dev = [
    "fusionflux[study]",
    # Builds the wheel that tests/test_packaging.py and tests/test_wheel_smoke.py
    # inspect and install. Without it both suites skip rather than fail, which is
    # deliberate for a contributor and not acceptable in CI, so both CI jobs
    # install it explicitly.
    "build",
    "jupyter",
    "mypy",
    # Reads the committed paper PDF back so tests/test_reported_numbers.py can
    # check it did not go stale against paper.tex.
    "pypdf",
    "pytest",
    "pytest-cov",
    "ruff",
    # tomllib is stdlib from 3.11; the release-metadata and entry-point tests
    # read pyproject.toml and need a reader on the lowest supported version.
    "tomli; python_version < '3.11'",
    # setup.py's build hook needs it, and `python -m build --no-isolation` in the
    # packaging suites builds against this environment rather than fetching one.
    "setuptools>=77",
]

[project.scripts]
fusionflux = "fusionflux.cli:main"

[tool.setuptools]
# The wheel installs the callable study and nothing else. It deliberately does
# not install the analysis modules (`hdb5.py`,
# `scaling_law.py`, `dimensional.py`, `analysis_*.py`, `config.py`, `storage.py`,
# `validation.py`, `forecast.py`, ...).
#
# Two reasons, and the first is the serious one. Shipped as top-level modules
# they would land in site-packages under names as generic as `config`, `tools`,
# `storage` and `validation`, where they shadow any other project's module of
# the same name in the same environment. Installing a fusion study should not
# change what `import config` means for everything else installed alongside it.
#
# Second, they could not run anyway: every one of them needs a dataset fetched
# from OSF on demand and never redistributed, so the wheel has nothing to feed
# them. They are run from a checkout, which is how the documentation has always
# invoked them (`python3 hdb5.py train`).
#
# `neutron_yield` is left out for the same reason rather than as a demotion. It
# imports the top-level `config`, `storage` and `validation` above, and
# `config.PROJECT_ROOT` is `Path(config.__file__).parent`, so an installed copy
# resolves its data directories inside site-packages and writes training runs
# there. It has therefore never been usable from a wheel, and it does not become
# usable by being listed here. It runs from a checkout, which is what
# `docs/neutron-yield-pipeline.md` documents.
packages = ["fusionflux"]

[tool.setuptools.package-data]
# Copied from results/predictor.json by setup.py at build time. Without it the
# installed `fusionflux predict` has no coefficients to read.
fusionflux = ["predictor.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# The codebase intentionally uses long, descriptive lines; enforce everything
# except the line-length rule.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Builds a wheel and a virtualenv, so it costs seconds rather than
    # milliseconds and resolves dependencies from the network. Run in its own CI
    # job (`wheel` in ci.yml) and before every release; deselected from the
    # interpreter matrix with `-m "not slow"`.
    "slow: exercises a real clean install of the built distribution",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
# No python_version: each CI job checks at its own interpreter version. Pinning
# it to the lowest supported target broke both directions once mypy 2.0 dropped
# 3.9, the version pinned here at the time: the setting was rejected outright,
# and the stale target then failed to parse the PEP 695 `type` statements in
# current numpy stubs. The lowest-version job still verifies the semantics of
# `requires-python`, because it installs the mypy pinned in constraints.txt.
ignore_missing_imports = true
warn_unused_ignores = true
# A wheel build copies every top-level module into build/lib, which mypy then
# sees as a second definition of each one and refuses to check anything at all.
# Building the distribution should not break `make check`.
# `scaling-audit/` is a second distribution over the module at the repository
# root. Its `scaling_audit.py` is a build-time copy of the root file, so mypy
# sees two modules of one name and refuses to check anything; and its setup.py
# collides with the root one the same way. The sources they duplicate are both
# checked here at their real paths.
exclude = ["^build/", "^scaling-audit/"]

[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*", "seaborn.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = [
    "allometry",
    "analysis_allometry",
    "analysis_boundedness",
    "analysis_conformal",
    "analysis_conformal_shift",
    "analysis_dimensional",
    "analysis_extrapolation",
    "analysis_flexibility_sweep",
    "analysis_forecast",
    "analysis_gp",
    "analysis_hybrid",
    "analysis_mechanism",
    "analysis_replication",
    "analysis_robustness",
    "analysis_scaling_law",
    "analysis_sensitivity",
    "analysis_size_extrapolation",
    "analysis_summary_figure",
    "analysis_tree_allometry",
    "config",
    "conformal_shift",
    "dimensional",
    "forecast",
    "fusionflux",
    "gp",
    "hdb5",
    "lawson",
    "neutron_yield",
    "replication",
    "scaling_audit",
    "scaling_law",
    "spectral",
    "storage",
    "tools",
    "tree_allometry",
    "train_model",
    "validation",
]

[tool.coverage.report]
show_missing = true
# Measured, not guessed. The suite covers 77.23% with all four datasets present
# (1531 of 6724 statements missed), which is the state CI is in modulo the tests
# that skip there for want of a dataset or a trained artifact. The
# without-datasets figure is no longer quoted here: the last one measured,
# 77.47%, predates four modules joining the measured set and is now higher than
# the with-datasets number, which cannot be right. Re-measure it before quoting
# it again rather than carrying a figure that contradicts the one above it.
# "All four" is HDB5 STD5, the full DB5.2.3 revision, the mammalian
# metabolic-rate deposit Result 13 replicates on, and the Biomass And Allometry
# Database Result 15's feature ladder runs on.
#
# The figure falls whenever a module joins the measured set, because the
# denominator grows before any test for it exists. It went 78.93 -> 78.29 when
# Results 14 and 15 arrived, and 78.29 -> 75.67 when analysis_boundedness,
# analysis_mechanism, analysis_robustness and analysis_sensitivity were added
# here, having been absent from this list and from the suite entirely.
#
# That last one broke the floor, and the fix was tests rather than a lower
# floor: robustness went 35 -> 85% and sensitivity 19 -> 47%, bringing the total
# to 77.23%. The four sit at 63% together, in line with the other analysis_*.py
# modules (42-90%), because the ordinary suite exercises their functions rather
# than their full regeneration paths.
# Both figures reproduce exactly across clean runs, and no measured module
# branches on sys.version_info, so the three CI interpreters have nothing to
# disagree about.
#
# The floor is therefore set just under the CI figure rather than well under
# it. Its job is to catch a test file or module falling out of the suite, and
# the tighter it sits the smaller the regression it catches. The headroom that
# would buy stability is not needed: the only time this metric moved by more
# than a point, the cause was another process editing the working tree
# mid-run, which is not a condition CI is ever in.
#
# A ratchet, not a target. Raise it when coverage genuinely rises. Never lower
# it to make a run pass -- if it trips, find out what stopped running.
fail_under = 77
