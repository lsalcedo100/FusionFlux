[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fusionflux"
version = "0.1.0"
description = "Train and run FusionFlux: a physics-aware ML pipeline for predicting D-T fusion neutron yield."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Liam" }]
dependencies = [
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "mypy",
    # Reads the committed paper PDF back so tests/test_reported_numbers.py can
    # check it did not go stale against paper.tex.
    "pypdf",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
fusionflux = "neutron_yield.fusionflux_cli:main"

[tool.setuptools]
packages = ["neutron_yield", "tools"]
py-modules = [
    "analysis_conformal",
    "analysis_extrapolation",
    "analysis_flexibility_sweep",
    "analysis_hybrid",
    "analysis_size_extrapolation",
    "analysis_scaling_law",
    "config",
    "hdb5",
    "lawson",
    "scaling_law",
    "storage",
    "train_model",
    "validation",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# The codebase intentionally uses long, descriptive lines; enforce everything
# except the line-length rule.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
# No python_version: each CI job checks at its own interpreter version. Pinning
# it to 3.9 broke both directions once mypy 2.0 dropped 3.9 as a target. The
# setting was rejected outright, and the stale target then failed to parse the
# PEP 695 `type` statements in current numpy stubs. The 3.9 job still verifies
# 3.9 semantics, because it installs the mypy pinned in constraints.txt.
ignore_missing_imports = true
warn_unused_ignores = true
# A wheel build copies every top-level module into build/lib, which mypy then
# sees as a second definition of each one and refuses to check anything at all.
# Building the distribution should not break `make check`.
exclude = ["^build/"]

[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*", "seaborn.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = [
    "analysis_conformal",
    "analysis_extrapolation",
    "analysis_flexibility_sweep",
    "analysis_hybrid",
    "analysis_size_extrapolation",
    "analysis_scaling_law",
    "config",
    "hdb5",
    "lawson",
    "scaling_law",
    "storage",
    "train_model",
    "validation",
    "neutron_yield",
    "tools",
]

[tool.coverage.report]
show_missing = true
# Measured, not guessed. The suite covers 75.57% with the HDB5 dataset present
# (1172 of 4798 statements missed) and 75.53% without it, which is the state CI
# is in: 13 tests skip there for want of the dataset or a trained artifact, and
# between them they account for 2 statements. Both figures reproduce exactly
# across clean runs, and no measured module branches on sys.version_info, so
# the four CI interpreters have nothing to disagree about.
#
# The floor is therefore set just under the CI figure rather than well under
# it. Its job is to catch a test file or module falling out of the suite, and
# the tighter it sits the smaller the regression it catches. The headroom that
# would buy stability is not needed: the only time this metric moved by more
# than a point, the cause was another process editing the working tree
# mid-run, which is not a condition CI is ever in.
#
# A ratchet, not a target. Raise it when coverage genuinely rises. Never lower
# it to make a run pass -- if it trips, find out what stopped running.
fail_under = 75
