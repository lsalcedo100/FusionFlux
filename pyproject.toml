[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fusionflux"
version = "0.1.0"
description = "Train and run FusionFlux: a physics-aware ML pipeline for predicting D-T fusion neutron yield."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Liam" }]
dependencies = [
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "mypy",
    # Reads the committed paper PDF back so tests/test_reported_numbers.py can
    # check it did not go stale against paper.tex.
    "pypdf",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
fusionflux = "neutron_yield.fusionflux_cli:main"

[tool.setuptools]
packages = ["neutron_yield", "tools"]
py-modules = [
    "analysis_conformal",
    "analysis_extrapolation",
    "analysis_flexibility_sweep",
    "analysis_hybrid",
    "analysis_size_extrapolation",
    "analysis_scaling_law",
    "config",
    "hdb5",
    "lawson",
    "scaling_law",
    "storage",
    "train_model",
    "validation",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# The codebase intentionally uses long, descriptive lines; enforce everything
# except the line-length rule.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
# No python_version: each CI job checks at its own interpreter version. Pinning
# it to 3.9 broke both directions once mypy 2.0 dropped 3.9 as a target. The
# setting was rejected outright, and the stale target then failed to parse the
# PEP 695 `type` statements in current numpy stubs. The 3.9 job still verifies
# 3.9 semantics, because it installs the mypy pinned in constraints.txt.
ignore_missing_imports = true
warn_unused_ignores = true
# A wheel build copies every top-level module into build/lib, which mypy then
# sees as a second definition of each one and refuses to check anything at all.
# Building the distribution should not break `make check`.
exclude = ["^build/"]

[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*", "seaborn.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = [
    "analysis_conformal",
    "analysis_extrapolation",
    "analysis_flexibility_sweep",
    "analysis_hybrid",
    "analysis_size_extrapolation",
    "analysis_scaling_law",
    "config",
    "hdb5",
    "lawson",
    "scaling_law",
    "storage",
    "train_model",
    "validation",
    "neutron_yield",
    "tools",
]

[tool.coverage.report]
show_missing = true
# The suite measured 75.7% when this floor was set, so the floor sits just
# below it. It is a ratchet against regression, not a target: raise it when
# coverage rises, never lower it to make a run pass.
#
# The shortfall is concentrated in the analysis_*.py report and main() paths,
# which need the real HDB5 dataset and so are exercised by the `reproduce`
# workflow rather than by this suite. Coverage measured here is therefore a
# floor on the dataset-free tests, not a statement about the analyses.
fail_under = 75
